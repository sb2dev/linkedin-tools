# Elasticsearch only. PostgreSQL, the API and the app all run on the host — see the README.
#
#   docker compose up -d --wait
#
# On Linux the kernel needs one setting or the container exits during bootstrap:
#   sudo sysctl -w vm.max_map_count=262144

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      # A few hundred profiles need nothing more, and a fixed heap keeps it predictable.
      ES_JAVA_OPTS: '-Xms1g -Xmx1g'
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      # A single node never goes green while a replica is unassigned, so yellow is healthy here.
      test: ['CMD-SHELL', 'curl -fsS "localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

volumes:
  elasticsearch-data:
